server {
    listen 80;
    server_name _;

    # SPA (history-mode router): serve index.html for anything not found
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # API upload contract: 25MB + multipart headroom
    client_max_body_size 30M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Immutable hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Laravel API + health: hand to php-fpm through the backend's public dir
    location ~ ^/(api|up) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        # large responses (file streaming) need room
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
