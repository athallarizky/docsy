name: docsy

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: docsy-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - docsy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx reverse proxy: public HTTP entrypoint
  web:
    image: nginx:alpine
    container_name: docsy-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - docsy
    depends_on:
      - app

  # PostgreSQL 16: relational storage (folder tree + recursive CTEs)
  db:
    image: postgres:16-alpine
    container_name: docsy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-docsy_db}
      POSTGRES_USER: ${DB_USERNAME:-docsy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/10-pgcrypto.sql:ro
    networks:
      - docsy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docsy} -d ${DB_DATABASE:-docsy_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 7: cache store + queue broker
  redis:
    image: redis:7-alpine
    container_name: docsy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docsy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue worker: background jobs (thumbnails, activity log)
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: docsy-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --backoff=5,30,120
    volumes:
      - ./:/var/www
    networks:
      - docsy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  docsy:
    driver: bridge

volumes:
  db_data:
  redis_data: